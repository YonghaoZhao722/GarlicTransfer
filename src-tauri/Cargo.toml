[package]
name = "garlic-transfer"
version = "0.2.17"
description = "Guided PS5 save download and upload"
edition = "2021"
rust-version = "1.77.2"
include = ["src/**/*", "Cargo.toml", "build.rs", "tauri.conf.json", "capabilities/**/*", "icons/**/*"]

[lib]
name = "garlic_transfer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
if-addrs = "0.13"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
